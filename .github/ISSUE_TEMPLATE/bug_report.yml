name: 缺陷报告
description: 报告可以复现的 Android 功能、数据或界面问题
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请确认问题可以复现，并删除截图、日志和存档中的个人信息与 API Key。

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 可在“我的 → 关于”中查看版本和 Build。
      placeholder: 1.0.0 (Build 1)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 一加 Ace 2 / Android 16
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      options:
        - Expo Go
        - GitHub Release APK
        - 本地构建 APK
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么，对数据或任务流程有什么影响。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 观察到...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或脱敏日志
      description: 请勿上传真实存档、API Key、签名文件或个人资料。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已删除敏感信息和真实用户数据。
          required: true
