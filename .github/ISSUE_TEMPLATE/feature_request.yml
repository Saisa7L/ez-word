name: 功能建议
description: 提出符合当前 Android 单机范围的新功能或体验改进
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明真实使用场景和当前阻碍。项目第一阶段只支持 Android 单机使用，不包含账号、自建服务器、云同步或应用商店上架。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 描述谁在什么情况下遇到了什么问题。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为，不必限定具体实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的其他方案

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 每日任务与学习
        - 错题本与复习
        - 词库导入与 AI 数据
        - 主题、资料与无障碍
        - 存档与数据安全
        - 构建、测试与文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 该建议不依赖账号、自建服务器或云端同步。
          required: true
