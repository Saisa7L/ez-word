changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feature
        - enhancement
    - title: 问题修复
      labels:
        - bug
        - fix
    - title: 数据与兼容性
      labels:
        - database
        - compatibility
    - title: 文档与工程
      labels:
        - documentation
        - ci
        - dependencies
    - title: 其他变更
      labels:
        - '*'
